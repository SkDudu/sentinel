name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build CLI
        run: pnpm --filter @sw/cli build

      - name: CLI help
        run: pnpm --filter @sw/cli exec node ./dist/index.js

      - name: Offline SARIF export smoke
        env:
          OPENAPI: ${{ github.workspace }}/examples/sample-openapi.json
          PLUGINS: ${{ github.workspace }}/examples/plugins
          SARIF_OUT: ${{ github.workspace }}/sentinel.sarif
        run: |
          set +e
          # pnpm exec cwd = apps/cli — always pass absolute paths
          pnpm --filter @sw/cli exec node ./dist/index.js scan \
            --openapi "$OPENAPI" \
            --base-url http://127.0.0.1:9 \
            --plugins "$PLUGINS" \
            --format sarif \
            --output "$SARIF_OUT" \
            --max-critical 999 \
            --max-high 999
          code=$?
          # 0 pass, 2 gate fail — both mean CLI ran end-to-end
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "Unexpected exit code: $code"
            exit 1
          fi
          test -f "$SARIF_OUT"
          grep -q '"version": "2.1.0"' "$SARIF_OUT"

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-sarif
          path: sentinel.sarif
          if-no-files-found: ignore
