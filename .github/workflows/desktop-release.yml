name: Desktop release

# Push to main → builds macOS + Windows and creates/updates the draft release
# v<version> (version from tauri.conf.json). Skipped once v<version> is published.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      # Draft releases have no git tag yet, so an existing tag means "already published".
      - id: version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already published — bump the version in tauri.conf.json to release again."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.published == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS (Apple Silicon)
          - platform: windows-latest
            name: Windows (x64)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      # The sidecar ships this runner's node binary; node:sqlite needs >= 22.5.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skips the Finder AppleScript step of bundle_dmg.sh on headless runners.
          CI: "true"
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v${{ needs.check.outputs.version }}
          releaseName: Sentinel v${{ needs.check.outputs.version }}
          releaseBody: |
            Unsigned build — see [docs/release.md](https://github.com/${{ github.repository }}/blob/main/docs/release.md#instalando-build-não-assinado) to open it on macOS / Windows.
          releaseDraft: true
          prerelease: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
